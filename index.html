<!DOCTYPE html><!--deklaratsioon et kasutame html5-->
<!--kommentar-->
<html lang="et">
<head> <!--tehniline info-->
    <meta charset="UTF-8">
    <title>Aaron veebirakenduste aluste tööd</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"
            integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI="
            crossorigin="anonymous"></script>
    <script src="tööd/js/kuupaevaFunktsioonid.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        $(document).ready(function () {
            // paremale nuppu vajutamine
            $('#paremale').click(function () {
                $('#osa1').animate({left: '200px'}, 1000)
                $(this).hide();
                $('#vasakule').show();
            });
            // vasaku nuppu vajutamine
            $('#vasakule').click(function () {
                $('#osa1').animate({left: '0px'}, 1000)
                $(this).hide();
                $('#paremale').show();
            });
        });

        function koordLugemine(event, ui){
            let koht=ui.offset;
            $('#koordinadid').html('x:'+koht.left+ ' || y'+koht.top)
        }
        function leheStart(){
            $('#erapilt').draggable();
            $('#erapilt').bind("drag", koordLugemine);
        }
    </script>
</head>
<body onload="leheStart()">
<body>
<!--veebilehe sisu, mis näeb kasutaja-->
<!--päis-->
<header>
    <h1>
        Aaron veebirakenduste aluste tööd
    </h1>
</header>

<!--sisu-->
<main>
    <section id="osa1">
      <h2>Tere tulemast!</h2>
        <p>See on veebirakenduste tunnis
            käsitsi kirjutatud leht!</p>
        <br>
        <br>
        <p>Palun kasuta navigeerimismenüü, et leida info!</p>
        </section>
    <input type="button" value="paremale" id="paremale">
    <input type="button" value="vasakule" id="vasakule">
    <input type="button" value="peida teksti"
           onclick="$('#osa1').hide(2000)">
    <input type="button" value="kuva teksti"
           onclick="$('#osa1').show(2000, alert('Kohe kuvab teksti'))">

    <section id="osa2">
        <h2>Päevapilt</h2>
        <img src="Pilt.png" alt="ilus pilt" id="erapilt">
        <br>
        <input type="button" value="TÄNA ON" onclick="tanaOn()">
        <div id="vastus"></div>
        <br>
        <input type="button" value="Sünnipäevani" onclick="synnipaevani()">
        <div id="vastus2"></div>
    </section>
    <div id="koordinadid"></div>
</main>
