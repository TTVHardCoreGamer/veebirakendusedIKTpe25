<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Map area kasutamine</title>
  <link rel="stylesheet" href="mapStyle.css">
</head>
<body>
<h1>Lehel on kasutatud map area käsud</h1>
<h2>palun kliki hiirega pildi erineva alale </h2>
<img src="maja.png" alt="ilus majake" usemap="#majakaart">
<!-- kasutame map'i (kaart) -->
<map name="majakaart">
  <!-- ring -circle coords=x, y, R-->
  <area shape="circle" coords="131,191,50" href="aken.html" alt="aken">
  <!-- ristkülik  rect coords=x, y, x1, y2-->
  <area shape="rect" coords="154,42,190,99" href="korsten.html" alt="hall korsten">
  <!-- mitu nurga polügoon -poly coords=x,y, x1, y1, x2, y2-kolmnurk-->
  <area shape="poly" coords="70,114,118,50,215,125" href="katus.html" alt="katus">
</map>
<div id="selgitus">
  Vajuta pildiala peale ja siia tuleb väike kirjeldus...
</div>

</body>
</html>
