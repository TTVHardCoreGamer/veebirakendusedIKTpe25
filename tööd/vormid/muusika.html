<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <script src="../js/muusikaScript.js"></script>
    <link rel="stylesheet" href="muusikaStyle.css">

</head>

<body>

<h1>Muusika küsimustik</h1>

<form action="#">
    <table border="1">

        <tr>
            <td>
                <label for="tund">Mitu tundi päevas sa kuulad muusikat?</label>
            </td>

            <td>
                <input type="range" min="0" max="24" step="1" value="6" id="tund" oninput="muusikaLugemine()">
            </td>

            <td>
                <div id="vastus"></div>
            </td>
        </tr>


        <tr>
            <td>
                <label>Kas sa kuulad raadiot?</label>
            </td>

            <td>
                <input type="radio" name="raadio" id="jah" value="jah" onclick="raadioValik()">
                <label for="jah">jah</label>

                <br>

                <input type="radio" name="raadio" id="ei" value="ei" onclick="raadioValik()">
                <label for="ei">ei</label>

                <br><br>

                <img id="raadioPilt" src="" alt="" width="150">
            </td>

            <td>
                <div id="vastus2"></div>
            </td>
        </tr>


        <tr>
            <td>
                <label>Milliseid muusikuid/ansambleid sa tead?</label>
            </td>

            <td>
                <input type="checkbox" name="muusik" id="noep" value="NOËP" onchange="muusikValik()">
                <label for="noep">NOËP</label>

                <br>

                <input type="checkbox" name="muusik" id="nublu" value="nublu" onchange="muusikValik()">
                <label for="nublu">nublu</label>

                <br>

                <input type="checkbox" name="muusik" id="tommy" value="Tommy Cash" onchange="muusikValik()">
                <label for="tommy">Tommy Cash</label>
            </td>

            <td>
                <div id="vastus3"></div>
            </td>
        </tr>


        <tr>
            <td>
                <label>Millist muusikat sa kõige rohkem kuulad?</label>
            </td>

            <td>
                <input type="radio" name="stiil" id="pop" value="Pop" onclick="stiiliValik()">
                <label for="pop">Pop</label>

                <br>

                <input type="radio" name="stiil" id="rock" value="Rock" onclick="stiiliValik()">
                <label for="rock">Rock</label>

                <br>

                <input type="radio" name="stiil" id="rap" value="Rap" onclick="stiiliValik()">
                <label for="rap">Rap</label>

                <br>

                <input type="radio" name="stiil" id="jazz" value="Jazz" onclick="stiiliValik()">
                <label for="jazz">Jazz</label>

                <br>

                <input type="radio" name="stiil" id="klassika" value="Klassika" onclick="stiiliValik()">
                <label for="klassika">Klassika</label>

                <br>

                <input type="radio" name="stiil" id="elektrooniline" value="Elektrooniline" onclick="stiiliValik()">
                <label for="elektrooniline">Elektrooniline</label>
            </td>

            <td>
                <div id="vastus5"></div>
            </td>
        </tr>


        <tr>
            <td>
                <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
            </td>

            <td>
                <textarea id="arvamus" rows="4" cols="30" oninput="arvamuseValik()" style="resize: none;"></textarea>

            </td>

            <td>
                <div id="vastus6"></div>
            </td>
        </tr>


        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>

            <td>
                <input type="button" value="Näita andmed" onclick="tervitus()">
            </td>

            <td>
                <div id="vastus4"></div>
            </td>
        </tr>

    </table>
</form>

</body>
</html>
