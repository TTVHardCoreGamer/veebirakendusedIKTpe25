<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"
            integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI="
            crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            // paremale nuppu vajutamine
            $('#paremale').click(function () {
                $('#tekstikast').animate({left: '200px'}, 1000)
                $(this).hide();
                $('#vasakule').show();
            });
            // vasaku nuppu vajutamine
            $('#vasakule').click(function () {
                $('#tekstikast').animate({left: '0px'}, 1000)
                $(this).hide();
                $('#paremale').show();
            });
        });

        //värvib teksti punase värviga
        function tekstPunaseks(){
            $('#tekstikast').css('color','red');
        }
        function tekstMustaks(){
            $('#tekstikast').css('color','black');
        }
        function koordLugemine(event, ui){
            let koht=ui.offset;
            $('#koordinadid').html('x:'+koht.left+ ' || y'+koht.top)
        }

        function leheStart(){
            $('#tekstikast').mouseenter(tekstPunaseks);
            $('#tekstikast').mouseleave(tekstMustaks);
            $('#tekstikast').draggable();
            $('#tekstikast').bind("drag", koordLugemine);
            $('#pilt').draggable();
            $('#pilt').bind("drag", koordLugemine);
        }
    </script>


    <link rel="stylesheet" href="queryStyle.css">
</head>
<body onload="leheStart()">
<header>
<h1>jQuery kasutamine</h1>
</header>

<main>
    <section>
        <h2>jQuery CDN</h2>
        <div id="tekstikast">
            jQuery - see on raamistik
            (teek)
            <br>
            CDN - raamistiku
            allalaadimisviis väliserverist
            <br>
            Ametlik CDN asub
            https://releases.jquery.com/

        </div>
        <input type="button" value="paremale" id="paremale">
        <input type="button" value="vasakule" id="vasakule">
        <input type="button" value="peida teksti"
               onclick="$('#tekstikast').hide(2000)">
        <input type="button" value="kuva teksti"
               onclick="$('#tekstikast').show(2000, alert('Kohe kuvab teksti'))">
    </section>
    <div id="koordinadid"></div>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTC1sNbfWaCTpBQ0_V09rzDUSbr53q3vEc3FAFvcVjPfA&s=10" alt="" id="pilt">
</main>

</body>
</html>
